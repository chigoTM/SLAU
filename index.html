<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Решение СЛАУ методом Гаусса-Жордана</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Решение СЛАУ методом Гаусса-Жордана</h1>
        <p class="subtitle">Приведение расширенной матрицы к единичной форме</p>

        <div class="controls">
            <label for="size">Размер системы (n × n):</label>
            <select id="size">
                <option value="2">2 × 2</option>
                <option value="3" selected>3 × 3</option>
                <option value="4">4 × 4</option>
                <option value="5">5 × 5</option>
                <option value="6">6 × 6</option>
                <option value="7">7 × 7</option>
                <option value="8">8 × 8</option>
                <option value="9">9 × 9</option>
                <option value="10">10 × 10</option>
            </select>
            <button id="buildMatrix">Построить матрицу</button>
        </div>

        <div id="matrixInputContainer" class="matrix-input-container"></div>

        <div class="controls">
            <button id="solveBtn" class="primary">Решить</button>
            <button id="exampleBtn">Пример</button>
            <button id="clearBtn">Очистить</button>
        </div>

        <div id="error" class="error"></div>

        <div id="solution" class="solution"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
